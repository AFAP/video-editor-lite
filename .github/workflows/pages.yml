name: Publish browser editor

on:
  push:
    branches: [main]
    paths:
      - index.html
      - favicon.svg
      - favicon.ico
      - favicon.png
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Check editor
        run: npm test
      - uses: actions/configure-pages@v6
      - name: Prepare static files
        run: |
          mkdir _site
          cp index.html favicon.svg favicon.ico favicon.png LICENSE _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Wait for pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 30); do
            body=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages&per_page=1")
            count=$(echo "$body" | jq -r '.total_count // 0')
            echo "attempt $attempt: github-pages artifacts = $count"
            if [ "$count" -gt 0 ]; then exit 0; fi
            sleep 2
          done
          echo "::error::github-pages artifact never appeared in the artifacts API"
          echo "$body" | head -c 2000
          exit 1
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
